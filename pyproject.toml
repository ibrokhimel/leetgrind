[project]
name = "leetgrind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12", "httpx>=0.27", "rich>=13.7",
    "questionary>=2.0", "tomli-w>=1.0",
    # Not dev-only: runner.run_tests shells out to `-m pytest` as the gate
    # inside `lc done`, so a plain `pip install .` needs it at runtime.
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["respx>=0.21"]

[project.scripts]
lc = "leetgrind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: hits the real LeetCode API (deselected by default)"]
addopts = "-m 'not live'"
